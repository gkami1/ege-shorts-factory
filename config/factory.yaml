# Single config for the whole pipeline. CLI: --config path/to/other.yaml
paths:
  tasks: tasks
  scripts: video_scripts
  out: out
  work: work          # per-task intermediate files (audio clips, timeline, captions, silent render)
  review: review      # scripts that failed verification land here (M3)

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 18
  preset: medium

timing:                 # seconds
  pad_before: 0.08      # silence before each clip inside its segment
  pad_after: 0.22       # hold after each clip
  min_segment: 1.2
  outro_hold: 1.0       # extra static time on the outro card

tts:
  # pluggable: speech/tts/*.py registered by name.
  #   qwen   — Qwen3-TTS, Apache-2.0: the production voice (GPU pod, see config/pod.yaml)
  #   silero — non-commercial license: local CPU previews only, never publish
  engine: silero
  qa:                   # whisper re-listens to every clip; re-take with another seed if it misheard
    enabled: true
    max_cer: 0.1         # character error rate vs the script (numbers compared as digits)
    retries: 2
  qwen:
    mode: clone         # clone (production: one fixed narrator) | custom (preset speaker) | design
    voice: assets/voices/narrator_ru   # clone: .wav + .txt reference made by `factory voice-design/voice-pick`
    speaker: Ryan       # custom mode
    instruct: ""        # custom/design: style or voice description
    language: Russian
    model: null         # null → 1.7B model for the mode (see speech/tts/qwen.py)
    device: auto        # auto | cuda:0 | cpu
    dtype: auto         # bfloat16 on GPU, float32 on CPU
    attn: auto          # flash_attention_2 if installed, else sdpa
    stress: strip       # strip | acute (U+0301) — compare in the bake-off
    seed: 1234
  cosyvoice:            # CosyVoice 3 clone (Apache-2.0), own venv: tools/cosyvoice_setup.sh
    voice: assets/voices/narrator_ru
    speed: 1.0
    seed: 1234
    text_frontend: false
    model_dir: null      # null → $COSYVOICE_MODEL_DIR (base model); a fine-tuned narrator dir from tools/cosyvoice_finetune.sh  # its zh/en text normalizer; our normalizer already did the work
  silero:
    model_url: https://models.silero.ai/models/tts/ru/v4_ru.pt
    speaker: aidar      # aidar | baya | kseniya | xenia | eugene
    sample_rate: 48000
    put_accent: true
    put_yo: true
    device: cpu

captions:
  aligner: whisper      # whisper | proportional
  whisper_model: small
  whisper_device: auto  # auto | cpu | cuda
  max_words: 3
  max_chars: 20
  font: Montserrat ExtraBold
  font_file: /usr/share/fonts/truetype/factory/Montserrat-ExtraBold.ttf
  size: 70
  y: 1390               # caption center, px from top (stays above the platform UI)
  pad_x: 30
  pad_y: 16
  radius: 22

render:
  palette: classic      # see render/style.py
  sheet_font: Liberation Serif
  hand_font: Caveat     # handwriting font (OFL, Cyrillic)

assemble:
  music: null           # path to a royalty-free track, or null
  music_volume: 0.07
  loudnorm: true        # -14 LUFS (platform standard)

llm:                    # M3 scriptwriter: any OpenAI-compatible server (vLLM on the pod: tools/llm_serve.sh)
  base_url: http://localhost:8001/v1
  model: Qwen/Qwen3.6-35B-A3B        # served name; candidates are compared with `factory llm-eval`
  samples: 5            # independent solutions per task (self-consistency)
  min_agreement: 0.6    # share of samples that must give the official answer
  repairs: 2            # rounds of "here are the verifier's errors, fix the JSON"
  solve_max_tokens: 16384
  write_max_tokens: 8192
  write_thinking: false
  solve_sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0}   # Qwen3.6 thinking defaults
  write_sampling: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
  example_script: m_profile_07_0001  # style example shown to the model
  timeout_s: 1800
