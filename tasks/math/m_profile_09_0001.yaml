topic: Задачи с прикладным содержанием
condition: 'Высота над землёй подброшенного вверх мяча меняется по закону $h(t) = 1{,}6 + 8t - 5t^2$, где $h$ — высота в метрах, $t$ — время в секундах. Сколько секунд мяч будет находиться на высоте не менее трёх метров?'
answer: "1,2"
